server:
  port: 8080

spring:
  application:
    name: viakids-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/viakids_db}
    username: ${SPRING_DATASOURCE_USERNAME:viakids}
    password: ${SPRING_DATASOURCE_PASSWORD:viakids123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:viakids}
    password: ${SPRING_RABBITMQ_PASSWORD:viakids123}
    virtual-host: /

jwt:
  secret: ${JWT_SECRET:ViaKidsSecretKeyForJWTTokenGenerationAndValidation2024Chile}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    com.viakids: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
